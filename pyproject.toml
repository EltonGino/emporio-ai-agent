[project]
name = "emporio-ai-agent"
version = "0.1.0"
description = "AI customer service agent for retail — built for Empório da Música."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "holidays>=0.107",
    "langchain>=1.4.7",
    "langchain-core>=1.7.3",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "typer>=0.27.3",
    "tzdata>=2026.6",
    "unidecode>=1.4.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
emporio-chat = "emporio_agent.cli:app"
emporio-api = "emporio_agent.api.main:run"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "emporio_agent"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "llm: calls the real LLM provider (needs an API key; skipped in CI with -m \"not llm\")",
    "embeddings: loads the real embedding model (~1 GB download on first run)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
