# Web UI + API in one container:  docker compose up --build  →  http://localhost:8000
# Settings come from .env (copy .env.example); the database paths below always win, so the
# SQLite files land in the named volume instead of the image.
services:
  emporio:
    build: .
    image: emporio-ai-agent:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/runtime/db/store.db
      CHECKPOINT_DB: /app/data/runtime/db/checkpoints.db
      PORT: "8000"
    volumes:
      - emporio-db:/app/data/runtime/db
      - emporio-traces:/app/data/runtime/traces
    restart: unless-stopped

volumes:
  emporio-db:
  emporio-traces:
